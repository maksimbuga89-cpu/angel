<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ангел</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070816; --nebula:#6c4cff; --aurora:#3ee6d0; --star:#f2f4ff; --planet:#ff9f6b;
  --glass:rgba(20,22,52,.72); --line:rgba(160,170,255,.16); --dim:#9aa0d0;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 20% 0%,#1a1250 0%,transparent 55%),
             radial-gradient(ellipse at 90% 40%,#0d2a4a 0%,transparent 50%),var(--void);
  color:var(--star);font-family:Manrope,system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 0;
}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 190px}
h1{font:700 28px Unbounded,sans-serif;letter-spacing:.5px;margin-bottom:14px}
.search{display:flex;gap:8px}
.search input{
  flex:1;min-width:0;padding:14px 16px;border-radius:16px;border:1px solid var(--line);
  background:var(--glass);color:var(--star);font:600 16px Manrope,sans-serif;outline:none;
}
.search input:focus-visible,button:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
.search input::placeholder{color:var(--dim)}
.search button{
  width:52px;border-radius:16px;border:0;background:var(--nebula);color:#fff;font-size:20px;cursor:pointer
}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font:600 14px Manrope,sans-serif;cursor:pointer
}
.chip.on{background:var(--aurora);color:#04131a;border-color:var(--aurora)}
#list{margin-top:8px}
.track{
  display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:16px;
  border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;font-family:inherit
}
.track:active{background:rgba(108,76,255,.18)}
.track.now{background:rgba(62,230,208,.1)}
.track img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#1b1d4a;flex:none}
.track .t{flex:1;min-width:0}
.track b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track span{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track time{font-size:13px;color:var(--dim)}
.note{color:var(--dim);text-align:center;padding:36px 12px;line-height:1.5}

/* Плеер-док */
#dock{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
.dock-in{max-width:560px;margin:0 auto}
.row{display:flex;align-items:center;gap:12px}
.planet{position:relative;width:64px;height:64px;flex:none}
.planet img{position:absolute;inset:8px;width:48px;height:48px;border-radius:50%;object-fit:cover;background:#1b1d4a}
.planet.spin img{animation:spin 14s linear infinite}
.planet svg{position:absolute;inset:0;width:64px;height:64px}
.orbit{fill:none;stroke:var(--line);stroke-width:2}
.arc{fill:none;stroke:var(--aurora);stroke-width:2;stroke-linecap:round;transform:rotate(-90deg);transform-origin:32px 32px}
.moon{transform-origin:32px 32px}
.moon circle{fill:var(--planet)}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{
  width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--star);
  font-size:20px;cursor:pointer
}
.ctl #play{background:var(--nebula);width:50px;height:50px;font-size:22px}
.seek{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--dim)}
.seek time{width:36px;text-align:center}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:28px;background:transparent;cursor:pointer
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--aurora) var(--p,0%),rgba(160,170,255,.25) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--star);margin-top:-6px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(160,170,255,.25)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--aurora)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--star)}
#volRow{display:none}
#volRow.open{display:flex}
#toast{
  position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-90px);
  z-index:9;background:#2a1d5a;border:1px solid var(--nebula);padding:10px 16px;border-radius:14px;
  font-size:14px;transition:transform .25s;max-width:90%;text-align:center
}
#toast.show{transform:translateX(-50%) translateY(0)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.planet.spin img{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="toast" role="status"></div>

<main>
  <h1>Ангел <small style="font:500 11px Manrope,sans-serif;color:var(--dim)">v3</small></h1>
  <form class="search" id="form">
    <input id="q" type="search" placeholder="Песня или исполнитель" enterkeyhint="search" autocomplete="off" aria-label="Поиск музыки">
    <button type="submit" aria-label="Найти">🔍</button>
  </form>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>

<section id="dock" aria-label="Плеер">
  <div class="dock-in">
    <div class="row">
      <div class="planet" id="planet">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle class="orbit" cx="32" cy="32" r="30"/>
          <circle class="arc" id="arc" cx="32" cy="32" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
          <g class="moon" id="moon"><circle cx="32" cy="2" r="3.5"/></g>
        </svg>
        <img id="cover" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
      </div>
      <div class="info">
        <b id="title">Выбери трек</b>
        <span id="artist">Нажми на любую песню в списке</span>
      </div>
      <div class="ctl">
        <button id="prev" aria-label="Предыдущий">⏮</button>
        <button id="play" aria-label="Играть">▶</button>
        <button id="next" aria-label="Следующий">⏭</button>
      </div>
    </div>
    <div class="seek">
      <time id="cur">0:00</time>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
      <time id="dur">0:00</time>
      <button id="volBtn" aria-label="Громкость" style="border:0;background:none;font-size:18px;cursor:pointer">🔊</button>
    </div>
    <div class="seek" id="volRow">
      <span style="width:36px;text-align:center">🔈</span>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Громкость">
      <span style="width:36px;text-align:center">🔊</span>
    </div>
  </div>
</section>

<script>
const CLIENT_ID = "c00ddc3c";
const API = "https://api.jamendo.com/v3.0/tracks/";
const GENRES = [["Популярное",""],["Русские","lang:ru"],["Электроника","electronic"],["Рок","rock"],["Хип-хоп","hiphop"],
  ["Поп","pop"],["Лоу-фай","lofi"],["Джаз","jazz"],["Классика","classical"],["Эмбиент","ambient"]];

const tg = window.Telegram?.WebApp;
if (tg){ tg.ready(); tg.expand(); tg.setHeaderColor?.("#070816"); tg.setBackgroundColor?.("#070816"); }

const $ = id => document.getElementById(id);
const audio = new Audio();
audio.preload = "auto";
audio.volume = 0.8;

let queue = [], idx = -1, failStreak = 0, tag = "";

/* ---------- Утилиты ---------- */
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
const setFill = (el, pct) => el.style.setProperty("--p", pct + "%");

/* ---------- Поиск ---------- */
async function load(q = "", genre = ""){
  $("list").innerHTML = '<p class="note">Ищу в космосе…</p>';
  const p = new URLSearchParams({client_id: CLIENT_ID, format: "json", limit: 30, imagesize: 200, audioformat: "mp32"});
  if (q) p.set("search", q); else p.set("order", "popularity_week");
  if (genre.startsWith("lang:")) p.set("lang", genre.slice(5));
  else if (genre) p.set("tags", genre);
  try {
    const r = await fetch(API + "?" + p, {signal: AbortSignal.timeout(10000)});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (data.headers && data.headers.status === "failed") throw new Error("jamendo: " + (data.headers.error_message || "failed"));
    queue = (data.results || []).filter(t => t.audio);
    idx = -1;
    render();
  } catch (e) {
    const badKey = CLIENT_ID.startsWith("ВСТАВЬ") || /jamendo/i.test(e.message);
    $("list").innerHTML = badKey
      ? '<p class="note">Плеер не получил доступ к музыке.<br>Проверь CLIENT_ID в файле index.html: ключ Jamendo не вставлен или неверный.<br><small>' + esc(e.message) + '</small></p>'
      : '<p class="note">Не удалось загрузить музыку.<br>Проверь интернет и нажми на жанр ещё раз.<br><small>' + esc(e.message) + '</small></p>';
  }
}

function render(){
  const box = $("list");
  if (!queue.length){
    box.innerHTML = '<p class="note">Ничего не нашлось 🔭<br>Попробуй другое название.</p>';
    return;
  }
  box.innerHTML = queue.map((t, i) => `
    <button class="track${i === idx ? " now" : ""}" data-i="${i}">
      <img src="${esc(t.image || "")}" alt="" loading="lazy">
      <div class="t"><b>${esc(t.name)}</b><span>${esc(t.artist_name)}</span></div>
      <time>${fmt(t.duration)}</time>
    </button>`).join("");
}
$("list").addEventListener("click", e => {
  const b = e.target.closest(".track"); if (b) play(+b.dataset.i);
});

/* ---------- Плеер ---------- */
function play(i){
  if (i < 0 || i >= queue.length) return;
  idx = i;
  const t = queue[i];
  audio.src = t.audio;
  audio.play().catch(() => {});
  $("title").textContent = t.name;
  $("artist").textContent = t.artist_name;
  $("cover").src = t.image || $("cover").src;
  document.querySelectorAll(".track").forEach((el, k) => el.classList.toggle("now", k === i));
  if ("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.name, artist: t.artist_name, artwork: t.image ? [{src: t.image, sizes: "200x200"}] : []
    });
  }
  tg?.HapticFeedback?.impactOccurred("light");
}
const next = () => play(idx + 1 < queue.length ? idx + 1 : 0);
const prev = () => audio.currentTime > 4 ? (audio.currentTime = 0) : play(idx > 0 ? idx - 1 : queue.length - 1);
const toggle = () => { if (idx < 0 && queue.length) return play(0); audio.paused ? audio.play() : audio.pause(); };

$("play").onclick = toggle;
$("next").onclick = next;
$("prev").onclick = prev;
$("volBtn").onclick = () => $("volRow").classList.toggle("open");

audio.addEventListener("play",  () => { $("play").textContent = "⏸"; $("planet").classList.add("spin"); });
audio.addEventListener("pause", () => { $("play").textContent = "▶"; $("planet").classList.remove("spin"); });
audio.addEventListener("playing", () => { failStreak = 0; });
audio.addEventListener("ended", next);
audio.addEventListener("error", () => {
  failStreak++;
  if (failStreak >= Math.min(queue.length, 3)){ toast("Трек не загрузился. Проверь интернет."); failStreak = 0; return; }
  toast("Этот трек недоступен, включаю следующий");
  setTimeout(next, 700);
});
audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => {
  const d = audio.duration || 0, c = audio.currentTime;
  const pct = d ? c / d : 0;
  $("cur").textContent = fmt(c);
  if (!seeking){ $("seek").value = pct * 1000; setFill($("seek"), pct * 100); }
  $("arc").style.strokeDashoffset = 188.5 * (1 - pct);
  $("moon").style.transform = `rotate(${pct * 360}deg)`;
});

let seeking = false;
const sk = $("seek");
sk.addEventListener("input", () => {
  seeking = true; setFill(sk, sk.value / 10);
  if (audio.duration) $("cur").textContent = fmt(audio.duration * sk.value / 1000);
});
sk.addEventListener("change", () => {
  if (audio.duration) audio.currentTime = audio.duration * sk.value / 1000;
  seeking = false;
});
const vl = $("vol");
vl.addEventListener("input", () => { audio.volume = vl.value / 100; setFill(vl, vl.value);
  $("volBtn").textContent = vl.value == 0 ? "🔇" : "🔊"; });
setFill(vl, 80);

if ("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", next);
  navigator.mediaSession.setActionHandler("previoustrack", prev);
}

/* ---------- Жанры и форма ---------- */
$("chips").innerHTML = GENRES.map(([n, g], i) =>
  `<button class="chip${i === 0 ? " on" : ""}" data-g="${g}">${n}</button>`).join("");
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c));
  tag = c.dataset.g; $("q").value = ""; load("", tag);
});
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  $("q").blur();
  document.querySelectorAll(".chip").forEach((x, i) => x.classList.toggle("on", i === 0));
  load(q, "");
});

/* ---------- Звёздное небо ---------- */
(function sky(){
  const cv = $("sky"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, stars = [];
  function size(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
    stars = Array.from({length: 110}, () => ({
      x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.3 + .3) * dpr,
      s: Math.random() * .25 + .05, a: Math.random() * 6.28
    }));
  }
  function frame(t){
    ctx.clearRect(0, 0, w, h);
    for (const s of stars){
      const a = .45 + .45 * Math.sin(t / 900 + s.a);
      ctx.fillStyle = `rgba(242,244,255,${still ? .7 : a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
      if (!still){ s.y += s.s; if (s.y > h) { s.y = 0; s.x = Math.random() * w; } }
    }
    if (!still && !document.hidden) requestAnimationFrame(frame);
  }
  addEventListener("resize", size);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !still) requestAnimationFrame(frame); });
  size(); requestAnimationFrame(frame);
})();

load();
</script>
</body>
</html>
