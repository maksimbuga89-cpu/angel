<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ангел</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070816; --nebula:#6c4cff; --aurora:#3ee6d0; --star:#f2f4ff; --planet:#ff9f6b; --heart:#ff5c8a;
  --glass:rgba(20,22,52,.72); --line:rgba(160,170,255,.16); --dim:#9aa0d0;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 20% 0%,#1a1250 0%,transparent 55%),
             radial-gradient(ellipse at 90% 40%,#0d2a4a 0%,transparent 50%),var(--void);
  color:var(--star);font-family:Manrope,system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 0;
}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 230px}
h1{font:700 28px Unbounded,sans-serif;letter-spacing:.5px;margin-bottom:14px}
.search input{
  width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);
  background:var(--glass);color:var(--star);font:600 16px Manrope,sans-serif;outline:none;
}
.search input:focus-visible,button:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;padding:14px 0 6px}
.chip{
  flex:1;padding:11px 15px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font:600 15px Manrope,sans-serif;cursor:pointer
}
.chip.on{background:var(--aurora);color:#04131a;border-color:var(--aurora)}
#sum{font-size:13px;color:var(--dim);padding:8px 4px 0}
#list{margin-top:6px}
.track{display:flex;align-items:center;gap:4px;border-radius:16px}
.track.now{background:rgba(62,230,208,.1)}
.track .open{
  flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;
  border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;font-family:inherit
}
.track .open:active{background:rgba(108,76,255,.18)}
.track img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#1b1d4a;flex:none}
.track .t{flex:1;min-width:0}
.track b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .sub{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track time{font-size:13px;color:var(--dim)}
.like{
  flex:none;min-width:52px;height:48px;border:0;border-radius:14px;background:transparent;color:var(--dim);
  font:600 13px Manrope,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px
}
.like .h{font-size:18px;line-height:1}
.like.on{color:var(--heart)}
.note{color:var(--dim);text-align:center;padding:36px 12px;line-height:1.5}

/* Плеер-док */
#dock{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
.dock-in{max-width:560px;margin:0 auto}
.row{display:flex;align-items:center;gap:12px}
.planet{position:relative;width:64px;height:64px;flex:none}
.planet img{position:absolute;inset:8px;width:48px;height:48px;border-radius:50%;object-fit:cover;background:#1b1d4a}
.planet.spin img{animation:spin 14s linear infinite}
.planet svg{position:absolute;inset:0;width:64px;height:64px}
.orbit{fill:none;stroke:var(--line);stroke-width:2}
.arc{fill:none;stroke:var(--aurora);stroke-width:2;stroke-linecap:round;transform:rotate(-90deg);transform-origin:32px 32px}
.moon{transform-origin:32px 32px}
.moon circle{fill:var(--planet)}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{
  width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--star);
  font-size:20px;cursor:pointer
}
.ctl #play{background:var(--nebula);width:50px;height:50px;font-size:22px}
.seek{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--dim)}
.seek time{width:36px;text-align:center}
.tools{display:flex;justify-content:space-between;margin-top:4px}
.tool{
  min-width:56px;height:40px;padding:0 10px;border-radius:12px;border:0;background:transparent;color:var(--dim);
  font:600 14px Manrope,sans-serif;cursor:pointer;opacity:.8
}
.tool.on{color:var(--aurora);opacity:1}
.tool:disabled{opacity:.35;cursor:default}
#dLike.on{color:var(--heart);opacity:1}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:28px;background:transparent;cursor:pointer
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--aurora) var(--p,0%),rgba(160,170,255,.25) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--star);margin-top:-6px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(160,170,255,.25)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--aurora)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--star)}
#volRow{display:none}
#volRow.open{display:flex}
#toast{
  position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-90px);
  z-index:9;background:#2a1d5a;border:1px solid var(--nebula);padding:10px 16px;border-radius:14px;
  font-size:14px;transition:transform .25s;max-width:90%;text-align:center
}
#toast.show{transform:translateX(-50%) translateY(0)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.planet.spin img{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="toast" role="status"></div>

<main>
  <h1>Ангел</h1>
  <div class="search">
    <input id="q" type="search" placeholder="Поиск по плейлисту" autocomplete="off" aria-label="Поиск по плейлисту">
  </div>
  <div class="chips" id="chips">
    <button class="chip on" data-tab="wave">🌊 Волна</button>
    <button class="chip" data-tab="fav">❤ Избранное</button>
  </div>
  <div id="sum"></div>
  <div id="list"></div>
</main>

<section id="dock" aria-label="Плеер">
  <div class="dock-in">
    <div class="row">
      <div class="planet" id="planet">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle class="orbit" cx="32" cy="32" r="30"/>
          <circle class="arc" id="arc" cx="32" cy="32" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
          <g class="moon" id="moon"><circle cx="32" cy="2" r="3.5"/></g>
        </svg>
        <img id="cover" alt="">
      </div>
      <div class="info">
        <b id="title">Выбери трек</b>
        <span id="artist">Нажми на любую песню в списке</span>
      </div>
      <div class="ctl">
        <button id="prev" aria-label="Предыдущий">⏮</button>
        <button id="play" aria-label="Играть">▶</button>
        <button id="next" aria-label="Следующий">⏭</button>
      </div>
    </div>
    <div class="seek">
      <time id="cur">0:00</time>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
      <time id="dur">0:00</time>
    </div>
    <div class="tools">
      <button class="tool" id="shuffle" aria-label="Перемешать" aria-pressed="false">🔀</button>
      <button class="tool" id="dLike" aria-label="В избранное" disabled>🤍</button>
      <button class="tool" id="repeat" aria-label="Повтор">🔁</button>
      <button class="tool" id="volBtn" aria-label="Громкость">🔊</button>
    </div>
    <div class="seek" id="volRow">
      <span style="width:36px;text-align:center">🔈</span>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Громкость">
      <span style="width:36px;text-align:center">🔊</span>
    </div>
  </div>
</section>

<script>
/* Адрес API. Если сайт открыт с адреса бота — ничего менять не надо.
   Если сайт лежит на GitHub Pages, впиши сюда адрес бота: "https://что-то.trycloudflare.com" */
const DEFAULT_API = "";
const API_BASE = (new URLSearchParams(location.search).get("api") || DEFAULT_API ||
  (location.protocol.startsWith("http") && !/\.github\.io$/.test(location.hostname) ? location.origin : "")).replace(/\/$/, "");
const PH = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c4cff"/><stop offset="1" stop-color="#3ee6d0"/></linearGradient></defs><rect width="52" height="52" fill="url(#g)"/><text x="26" y="34" font-size="24" text-anchor="middle">🎵</text></svg>');

const tg = window.Telegram?.WebApp;
if (tg && tg.initData){ tg.ready(); tg.expand(); tg.setHeaderColor?.("#070816"); tg.setBackgroundColor?.("#070816"); }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const setFill = (el, pct) => el.style.setProperty("--p", pct + "%");
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ---------- Хранилище настроек (может быть недоступно) ---------- */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
let CID = store.get("angel_cid");
if (!CID || !/^[A-Za-z0-9-]{16,64}$/.test(CID)){
  CID = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
  store.set("angel_cid", CID);
}

async function api(path, opt = {}){
  const headers = {"X-Client-Id": CID, "ngrok-skip-browser-warning": "1"};
  if (tg && tg.initData) headers["X-Init-Data"] = tg.initData;
  const r = await fetch(API_BASE + path, {...opt, headers, signal: AbortSignal.timeout(10000)});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* ---------- Состояние ---------- */
const audio = new Audio();
audio.preload = "auto";
audio.volume = 0.8;

let all = [];                 // все треки «Волны», самые популярные первыми
const byId = new Map();
let tab = "wave", term = "";
let curId = null, counted = false, failStreak = 0;
let playIds = [], order = [], pos = -1;      // очередь воспроизведения
let shuffleOn = store.get("angel_shuffle") === "1";
let repeat = ["all","one","off"].includes(store.get("angel_repeat")) ? store.get("angel_repeat") : "all";

const popular = (a, b) => b.likes - a.likes || b.plays - a.plays || b.id - a.id;
const sub = t => `${esc(t.performer)} · ▶ ${t.plays}`;

/* ---------- Загрузка плейлиста ---------- */
async function loadAll(silent = false){
  if (!API_BASE){
    $("list").innerHTML = '<p class="note">Не указан адрес бота.<br>Открой сайт по ссылке из Telegram-бота<br>или впиши адрес в DEFAULT_API в index.html.</p>';
    return;
  }
  if (!silent) $("list").innerHTML = '<p class="note">Открываю плейлист…</p>';
  try {
    const data = await api("/api/playlist");
    all = (data.tracks || []).sort(popular);
    byId.clear(); all.forEach(t => byId.set(t.id, t));
    render(); syncDock();
  } catch (e) {
    if (silent) return;
    $("list").innerHTML = '<p class="note">Плейлист сейчас недоступен.<br>Бот выключен или нет связи. Попробуй позже.<br><small>' + esc(e.message) + '</small></p>';
  }
}

function viewList(){
  let l = tab === "fav" ? all.filter(t => t.liked) : all;
  const s = term.trim().toLowerCase();
  if (s) l = l.filter(t => (t.title + " " + t.performer).toLowerCase().includes(s));
  return l;
}

function rowHtml(t){
  return `<div class="track${t.id === curId ? " now" : ""}" data-id="${t.id}">
    <button class="open" data-act="play" aria-label="Играть: ${esc(t.title)}">
      <img src="${PH}" alt="">
      <div class="t"><b>${esc(t.title)}</b><span class="sub">${sub(t)}</span></div>
      <time>${fmt(t.duration)}</time>
    </button>
    <button class="like${t.liked ? " on" : ""}" data-act="like" aria-pressed="${t.liked}" aria-label="Лайк">
      <span class="h">${t.liked ? "❤" : "🤍"}</span><span class="n">${t.likes}</span>
    </button>
  </div>`;
}

function render(){
  const l = viewList(), box = $("list");
  const plays = all.reduce((s, t) => s + t.plays, 0), likes = all.reduce((s, t) => s + t.likes, 0);
  $("sum").textContent = all.length ? `${all.length} треков · ▶ ${plays} · ❤ ${likes}` : "";
  if (!l.length){
    box.innerHTML = term.trim() ? '<p class="note">Ничего не нашлось 🔭</p>'
      : tab === "fav" ? '<p class="note">Здесь будут песни, которым ты поставил ❤<br>Видишь их только ты.</p>'
      : '<p class="note">В «Волне» пока пусто 🌑<br>Владелец добавит треки через бота.</p>';
    return;
  }
  box.innerHTML = l.map(rowHtml).join("");
}

function patchRow(id){
  const t = byId.get(id), el = $("list").querySelector(`.track[data-id="${id}"]`);
  if (!t || !el) return;
  el.querySelector(".sub").innerHTML = sub(t);
  const lk = el.querySelector(".like");
  lk.classList.toggle("on", t.liked); lk.setAttribute("aria-pressed", t.liked);
  lk.querySelector(".h").textContent = t.liked ? "❤" : "🤍";
  lk.querySelector(".n").textContent = t.likes;
}

function syncDock(){
  const t = byId.get(curId), b = $("dLike");
  b.disabled = !t;
  b.classList.toggle("on", !!t?.liked);
  b.textContent = t?.liked ? "❤" : "🤍";
  b.setAttribute("aria-pressed", !!t?.liked);
  document.querySelectorAll(".track").forEach(el => el.classList.toggle("now", +el.dataset.id === curId));
}

/* ---------- Лайки и прослушивания ---------- */
async function toggleLike(id){
  const t = byId.get(id); if (!t) return;
  t.liked = !t.liked; t.likes += t.liked ? 1 : -1;
  tg?.HapticFeedback?.impactOccurred?.("light");
  tab === "fav" ? render() : patchRow(id);
  syncDock();
  try {
    const r = await api("/api/like/" + id, {method: "POST"});
    t.liked = r.liked; t.likes = r.likes;
  } catch (e) {
    t.liked = !t.liked; t.likes += t.liked ? 1 : -1;
    toast("Не получилось поставить лайк");
  }
  tab === "fav" ? render() : patchRow(id);
  syncDock();
}

function countPlay(id){
  const t = byId.get(id); if (!t) return;
  api("/api/play/" + id, {method: "POST"}).then(r => {
    if (r.counted){ t.plays++; patchRow(id); }
  }).catch(() => {});
}

/* ---------- Очередь: перемешивание и повтор ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function rebuildOrder(startId){
  order = playIds.slice();
  if (shuffleOn){
    shuffleArr(order);
    const i = order.indexOf(startId);
    if (i > 0){ order.splice(i, 1); order.unshift(startId); }
  }
  pos = order.indexOf(startId);
}

function playFromList(id){
  playIds = viewList().map(t => t.id);
  rebuildOrder(id);
  playTrack(id);
}

function playTrack(id){
  const t = byId.get(id); if (!t) return;
  curId = id; counted = false;
  audio.src = API_BASE + "/api/stream/" + id;
  audio.play().catch(() => {});
  $("title").textContent = t.title;
  $("artist").textContent = t.performer;
  $("cover").src = PH;
  syncDock();
  if ("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({title: t.title, artist: t.performer});
  }
  tg?.HapticFeedback?.impactOccurred?.("light");
}

function step(dir, auto = false){
  if (!order.length) return;
  for (let k = 0; k < order.length; k++){
    let np = pos + dir;
    if (np >= order.length){
      if (auto && repeat === "off") return;
      if (shuffleOn) shuffleArr(order);
      np = 0;
    }
    if (np < 0) np = order.length - 1;
    pos = np;
    if (byId.has(order[pos])) return playTrack(order[pos]);
  }
}
const next = () => step(1);
const prev = () => audio.currentTime > 4 ? (audio.currentTime = 0) : step(-1);
const toggle = () => {
  if (curId == null){ const l = viewList(); if (l.length) playFromList(l[0].id); return; }
  audio.paused ? audio.play() : audio.pause();
};

function syncModes(){
  const sh = $("shuffle"), rp = $("repeat");
  sh.classList.toggle("on", shuffleOn); sh.setAttribute("aria-pressed", shuffleOn);
  rp.classList.toggle("on", repeat !== "off");
  rp.textContent = repeat === "one" ? "🔂" : "🔁";
  rp.setAttribute("aria-label", repeat === "one" ? "Повтор: один трек" : repeat === "all" ? "Повтор: весь плейлист" : "Повтор выключен");
}
$("shuffle").onclick = () => {
  shuffleOn = !shuffleOn; store.set("angel_shuffle", shuffleOn ? "1" : "0");
  if (curId != null && playIds.includes(curId)) rebuildOrder(curId);
  syncModes(); toast(shuffleOn ? "Перемешивание включено" : "Перемешивание выключено");
};
$("repeat").onclick = () => {
  repeat = repeat === "all" ? "one" : repeat === "one" ? "off" : "all";
  store.set("angel_repeat", repeat); syncModes();
  toast(repeat === "all" ? "Повтор: весь плейлист" : repeat === "one" ? "Повтор: один трек" : "Повтор выключен");
};
syncModes();

/* ---------- Кнопки и события ---------- */
$("play").onclick = toggle;
$("next").onclick = next;
$("prev").onclick = prev;
$("dLike").onclick = () => curId != null && toggleLike(curId);
$("volBtn").onclick = () => $("volRow").classList.toggle("open");

$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = +b.closest(".track").dataset.id;
  b.dataset.act === "like" ? toggleLike(id) : playFromList(id);
});
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c));
  tab = c.dataset.tab; render();
  if (tab === "wave") loadAll(true);   // подтянуть свежие лайки и пересортировать
});
$("q").addEventListener("input", e => { term = e.target.value; render(); });

audio.addEventListener("play",  () => { $("play").textContent = "⏸"; $("planet").classList.add("spin"); });
audio.addEventListener("pause", () => { $("play").textContent = "▶"; $("planet").classList.remove("spin"); });
audio.addEventListener("playing", () => { failStreak = 0; });
audio.addEventListener("ended", () => {
  if (repeat === "one"){ counted = false; audio.currentTime = 0; audio.play().catch(() => {}); }
  else step(1, true);
});
audio.addEventListener("error", () => {
  failStreak++;
  if (failStreak >= Math.min(order.length || 1, 3)){ toast("Трек не загрузился. Проверь интернет."); failStreak = 0; return; }
  toast("Этот трек недоступен, включаю следующий");
  setTimeout(next, 700);
});
audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => {
  const d = audio.duration || 0, c = audio.currentTime, pct = d ? c / d : 0;
  $("cur").textContent = fmt(c);
  if (!seeking){ $("seek").value = pct * 1000; setFill($("seek"), pct * 100); }
  $("arc").style.strokeDashoffset = 188.5 * (1 - pct);
  $("moon").style.transform = `rotate(${pct * 360}deg)`;
  /* прослушивание засчитывается через 15 секунд (или на середине короткого трека) */
  if (!counted && curId != null && c >= Math.min(15, (d || 30) / 2)){ counted = true; countPlay(curId); }
});

let seeking = false;
const sk = $("seek");
sk.addEventListener("input", () => {
  seeking = true; setFill(sk, sk.value / 10);
  if (audio.duration) $("cur").textContent = fmt(audio.duration * sk.value / 1000);
});
sk.addEventListener("change", () => {
  if (audio.duration) audio.currentTime = audio.duration * sk.value / 1000;
  seeking = false;
});
const vl = $("vol");
vl.addEventListener("input", () => { audio.volume = vl.value / 100; setFill(vl, vl.value);
  $("volBtn").textContent = vl.value == 0 ? "🔇" : "🔊"; });
setFill(vl, 80);

/* ---------- Звёздное небо ---------- */
(function sky(){
  const cv = $("sky"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, stars = [];
  function size(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
    stars = Array.from({length: 110}, () => ({
      x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.3 + .3) * dpr,
      s: Math.random() * .25 + .05, a: Math.random() * 6.28
    }));
  }
  function frame(t){
    ctx.clearRect(0, 0, w, h);
    for (const s of stars){
      const a = .45 + .45 * Math.sin(t / 900 + s.a);
      ctx.fillStyle = `rgba(242,244,255,${still ? .7 : a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
      if (!still){ s.y += s.s; if (s.y > h) { s.y = 0; s.x = Math.random() * w; } }
    }
    if (!still && !document.hidden) requestAnimationFrame(frame);
  }
  addEventListener("resize", size);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !still) requestAnimationFrame(frame); });
  size(); requestAnimationFrame(frame);
})();
