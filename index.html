<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ангел</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --sky:#eef3fb; --cloud:#ffffff; --ink:#1d2433; --mute:#6b7690;
  --gold:#c99a3b; --halo:#f3e3b5; --line:#d9e1f0;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--sky:#141a2a; --cloud:#1d2539; --ink:#eef1f8; --mute:#93a0bf; --gold:#e3b95c; --halo:#3a3322; --line:#2b3550}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  padding-top:var(--safe-t);display:flex;flex-direction:column}
header{padding:18px 18px 10px}
h1{font-size:28px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:26px;height:10px;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 12px var(--halo)}
.search{margin-top:12px;display:flex;gap:8px}
input[type=search]{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--cloud);color:var(--ink);font:inherit;font-size:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#list{flex:1;overflow-y:auto;padding:4px 12px 16px}
.hint{color:var(--mute);padding:8px 6px;font-size:14px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px;border:0;border-radius:12px;
  background:transparent;color:inherit;font:inherit;cursor:pointer}
.row:hover,.row.on{background:var(--cloud)}
.row img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--line)}
.row b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.row span{color:var(--mute);font-size:13px}
.row .t{min-width:0;flex:1}
.row .t b,.row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{background:var(--cloud);border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b))}
.now{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.now img{width:44px;height:44px;border-radius:8px;background:var(--line);object-fit:cover}
.now b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now span{font-size:13px;color:var(--mute)}
.bar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--gold);height:28px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:6px}
.ctl button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;cursor:pointer}
.ctl button:hover{background:var(--sky)}
.ctl .play{background:var(--gold);color:#fff;width:56px;height:56px;border-radius:50%;font-size:22px;padding:0}
.ctl .play:hover{background:var(--gold);filter:brightness(1.08)}
.vol{display:flex;align-items:center;gap:6px;width:120px}
.vol input{width:100%}
@media (max-width:420px){.vol{display:none}}
</style>
</head>
<body>
<header>
  <h1>Ангел</h1>
  <form class="search" id="f"><input id="q" type="search" placeholder="Исполнитель или трек" autocomplete="off"></form>
</header>

<div id="list"><div class="hint">Загружаю популярное…</div></div>

<footer>
  <div class="now"><img id="art" alt=""><div style="min-width:0"><b id="title">Ничего не играет</b><span id="artist">Выберите трек из списка</span></div></div>
  <div class="bar"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Перемотка"><span id="dur">0:00</span></div>
  <div class="ctl">
    <button id="prev" aria-label="Предыдущий">⏮</button>
    <button id="back" aria-label="Назад на 10 секунд">−10</button>
    <button id="pp" class="play" aria-label="Играть или пауза">▶</button>
    <button id="fwd" aria-label="Вперёд на 10 секунд">+10</button>
    <button id="next" aria-label="Следующий">⏭</button>
    <div class="vol"><span aria-hidden="true">🔈</span><input id="vol" type="range" min="0" max="100" value="80" aria-label="Громкость"></div>
  </div>
</footer>

<audio id="a" preload="none"></audio>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const HOST = "https://discoveryprovider.audius.co/v1";  // публичный каталог Audius
const APP = "Angel";
const $ = id => document.getElementById(id);
const a = $("a");
let tracks = [], idx = -1;

const fmt = s => { s = Math.max(0, s|0); return (s/60|0) + ":" + String(s%60).padStart(2,"0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(url){
  $("list").innerHTML = '<div class="hint">Ищу…</div>';
  try{
    const r = await fetch(url); const j = await r.json();
    tracks = j.data || [];
    render();
  }catch(e){ $("list").innerHTML = '<div class="hint">Не удалось загрузить. Проверьте интернет и повторите.</div>'; }
}
const trending = () => load(`${HOST}/tracks/trending?limit=40&app_name=${APP}`);
const search = q => load(`${HOST}/tracks/search?query=${encodeURIComponent(q)}&limit=40&app_name=${APP}`);

function render(){
  if(!tracks.length){ $("list").innerHTML = '<div class="hint">Ничего не найдено. Попробуйте другой запрос.</div>'; return; }
  $("list").innerHTML = tracks.map((t,i)=>`
    <button class="row ${i===idx?"on":""}" data-i="${i}">
      <img src="${esc(t.artwork?.["150x150"]||"")}" alt="">
      <div class="t"><b>${esc(t.title)}</b><span>${esc(t.user?.name||"")}</span></div>
      <span>${fmt(t.duration)}</span>
    </button>`).join("");
}

function play(i){
  if(i<0||i>=tracks.length) return;
  idx = i; const t = tracks[i];
  a.src = `${HOST}/tracks/${t.id}/stream?app_name=${APP}`;
  a.play().catch(()=>{});
  $("title").textContent = t.title; $("artist").textContent = t.user?.name||"";
  $("art").src = t.artwork?.["150x150"]||"";
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.user?.name||"",
      artwork:[{src:t.artwork?.["480x480"]||t.artwork?.["150x150"]||"", sizes:"480x480"}]});
  }
  render();
}

$("list").addEventListener("click", e => { const r = e.target.closest(".row"); if(r) play(+r.dataset.i); });
$("f").addEventListener("submit", e => { e.preventDefault(); const q=$("q").value.trim(); q? search(q) : trending(); $("q").blur(); });

$("pp").onclick = () => { if(!a.src){ if(tracks.length) play(0); return; } a.paused ? a.play() : a.pause(); };
$("prev").onclick = () => play(idx-1);
$("next").onclick = () => play(idx+1);
$("back").onclick = () => a.currentTime = Math.max(0, a.currentTime-10);
$("fwd").onclick  = () => a.currentTime = Math.min(a.duration||1e9, a.currentTime+10);
$("vol").oninput  = e => a.volume = e.target.value/100;
a.volume = .8;

let dragging = false;
$("seek").addEventListener("input", () => { dragging = true; $("cur").textContent = fmt($("seek").value/1000*(a.duration||0)); });
$("seek").addEventListener("change", () => { a.currentTime = $("seek").value/1000*(a.duration||0); dragging = false; });

a.addEventListener("timeupdate", () => {
  if(!dragging && a.duration){ $("seek").value = a.currentTime/a.duration*1000; $("cur").textContent = fmt(a.currentTime); }
});
a.addEventListener("loadedmetadata", () => $("dur").textContent = fmt(a.duration));
a.addEventListener("play",  () => $("pp").textContent = "⏸");
a.addEventListener("pause", () => $("pp").textContent = "▶");
a.addEventListener("ended", () => play(idx+1));

if("mediaSession" in navigator){
  const m = navigator.mediaSession;
  m.setActionHandler("play",()=>a.play()); m.setActionHandler("pause",()=>a.pause());
  m.setActionHandler("previoustrack",()=>play(idx-1)); m.setActionHandler("nexttrack",()=>play(idx+1));
}
trending();
</script>
</body>
</html>
